name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Vendored from speedysebi/cicd-template@v1 because this public repo
    # cannot call reusable workflows in that private repository.
    uses: ./.github/workflows/node-ci.yml
    with:
      package-manager: bun
      install-command: bun install --frozen-lockfile --ignore-scripts
      scripts: "typecheck test"
      extra-command: npm pack --dry-run
