# Reusable CI for JavaScript / TypeScript projects (npm, pnpm, yarn or bun).
#
# Runs every package.json script named in `scripts` that actually exists, so
# a project with only a `test` script and one with lint+typecheck+test+build
# can both call it with zero configuration.
#
# Docs: docs/workflows/node-ci.md
name: Node CI

on:
  workflow_call:
    inputs:
      package-manager:
        description: "npm, pnpm, yarn or bun"
        type: string
        default: npm
      node-versions:
        description: 'JSON array of Node versions to test, e.g. ["20", "22"]'
        type: string
        default: '["22"]'
      bun-version:
        description: "Bun version when package-manager is bun"
        type: string
        default: latest
      os:
        description: 'JSON array of runners, e.g. ["ubuntu-latest", "windows-latest"]'
        type: string
        default: '["ubuntu-latest"]'
      working-directory:
        description: "Directory containing package.json"
        type: string
        default: "."
      install-command:
        description: "Override the install command (default depends on package-manager)"
        type: string
        default: ""
      scripts:
        description: "Space-separated package.json scripts to run in order; missing ones are skipped"
        type: string
        default: "lint typecheck test build"
      extra-command:
        description: "Extra shell command to run after the scripts"
        type: string
        default: ""
      artifact-path:
        description: "Path (relative to working-directory) to upload as an artifact; empty uploads nothing"
        type: string
        default: ""
      artifact-name:
        description: "Name of the uploaded artifact"
        type: string
        default: build
      timeout-minutes:
        type: number
        default: 15

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        node: ${{ fromJSON(inputs.node-versions) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      PM: ${{ inputs.package-manager }}
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          # Only cache when there is an npm lockfile; setup-node errors otherwise.
          cache: ${{ (inputs.package-manager == 'npm' && hashFiles(format('{0}/package-lock.json', inputs.working-directory)) != '') && 'npm' || '' }}
          cache-dependency-path: ${{ (inputs.package-manager == 'npm' && hashFiles(format('{0}/package-lock.json', inputs.working-directory)) != '') && format('{0}/package-lock.json', inputs.working-directory) || '' }}

      - name: Set up pnpm / yarn
        if: inputs.package-manager == 'pnpm' || inputs.package-manager == 'yarn'
        run: |
          if command -v corepack >/dev/null 2>&1; then
            corepack enable
          else
            # Node 25+ no longer bundles corepack. No lockfile can cover the
            # package manager itself, so this install is intentional.
            npm install --global "$PM"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: inputs.package-manager == 'bun'
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        env:
          INSTALL: ${{ inputs.install-command }}
        run: |
          if [ -z "$INSTALL" ]; then
            case "$PM" in
              npm)  INSTALL="npm ci" ;;
              pnpm) INSTALL="pnpm install --frozen-lockfile" ;;
              yarn)
                if yarn --version | grep -q '^1\.'; then
                  INSTALL="yarn install --frozen-lockfile"
                else
                  INSTALL="yarn install --immutable"
                fi ;;
              bun)  INSTALL="bun install --frozen-lockfile" ;;
              *) echo "::error::Unknown package-manager '$PM' (use npm, pnpm, yarn or bun)"; exit 1 ;;
            esac
          fi
          echo "+ $INSTALL"
          eval "$INSTALL"

      - name: Run scripts
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          for s in $SCRIPTS; do
            if node -e "process.exit(require('./package.json').scripts?.[process.argv[1]] ? 0 : 1)" "$s"; then
              echo "::group::$PM run $s"
              "$PM" run "$s"
              echo "::endgroup::"
            else
              echo "Skipping '$s' (not defined in package.json)"
            fi
          done

      - name: Extra command
        if: inputs.extra-command != ''
        env:
          CMD: ${{ inputs.extra-command }}
        run: eval "$CMD"

      - name: Upload artifact
        if: inputs.artifact-path != '' && strategy.job-index == 0
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}
          if-no-files-found: error
