name: Release Tag

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/node-ci.yml
    with:
      package-manager: bun
      install-command: bun install --frozen-lockfile --ignore-scripts
      scripts: "typecheck test"
      extra-command: npm pack --dry-run

  release:
    needs: checks
    permissions:
      contents: write
    uses: ./.github/workflows/release-reusable.yml
    with:
      version-file: package.json

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch npm publication for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh workflow run publish-npm.yml --repo "$GH_REPO" --ref "$TAG"
