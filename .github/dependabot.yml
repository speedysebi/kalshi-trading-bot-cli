# Keeps the SHA-pinned actions in .github/workflows current. Dependabot reads
# the `# vX.Y.Z` comment next to each pin and bumps the SHA and comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    # Wait a week after an action release before proposing it; most
    # compromised releases are caught and pulled within days.
    cooldown:
      default-days: 7
